# Keeps sdpotiguar.dedyn.io pointed at this connection's current public IP.
# Replaces the DuckDNS updater (docker-compose.duckdns.yml) - deSEC chosen
# for DNS-01 reliability after DuckDNS's nameservers proved flaky.
#
# Usage:
#   DESEC_TOKEN=<token from desec.io, never commit this> \
#     podman-compose -f docker-compose.desec.yml up -d

version: '3'

services:
  desec-dyndns:
    image: docker.io/library/alpine:latest
    restart: unless-stopped
    environment:
      - DESEC_TOKEN=${DESEC_TOKEN:?set DESEC_TOKEN before starting}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        apk add --no-cache curl >/dev/null
        while true; do
          curl -s "https://update.dedyn.io/?hostname=sdpotiguar.dedyn.io" \
            --header "Authorization: Token ${DESEC_TOKEN}"
          echo " $(date)"
          sleep 300
        done
