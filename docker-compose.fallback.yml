# HTTPS via Caddy, self-signed cert (tls internal). Fixes WhatsApp/Chrome
# force-upgrading links to https:// and hard-failing on plain HTTP.
#
# A real trusted cert was attempted via DNS-01 through two providers -
# DuckDNS (nameservers gave inconsistent/empty TXT values across 4
# attempts, 3 tools) and deSEC (persistent DNSSEC NSEC3 validation
# failure between Let's Encrypt and deSEC's signing for this domain,
# confirmed not a timing issue). Both abandoned. Self-signed works in
# Firefox; Chrome hangs on it for reasons not fully diagnosed - tell
# participants to use Firefox, or revisit Cloudflare Tunnel if that
# becomes acceptable later.
#
# The image still has both duckdns and desec DNS-01 plugins compiled in
# (Dockerfile.caddy) in case either is worth retrying later - see git
# history on Caddyfile.fallback for the DNS-01 config to restore.
#
# Usage:
#   TABBYCAT_DOMAIN=sdp-viii-interno.duckdns.org \
#     podman-compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.fallback.yml up -d

version: '3'

services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    depends_on:
      - web
    volumes:
      - ./Caddyfile.fallback:/etc/caddy/Caddyfile:ro,Z
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - TABBYCAT_DOMAIN=${TABBYCAT_DOMAIN:?set TABBYCAT_DOMAIN before starting}
    ports:
      - "8443:443"

volumes:
  caddy_data:
  caddy_config:
